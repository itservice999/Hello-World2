<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World - Puttatida Petyotha</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #f4f4f5 0%, #e4e4e7 100%);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 30px;
  }
  .card {
    text-align: center;
    color: #18181b;
    padding: 55px 65px;
    background: #ffffff;
    border: 1px solid #d4d4d8;
    border-top: 5px solid #1e3a8a;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    max-width: 440px;
  }
  h1 {
    font-size: 2.6rem;
    letter-spacing: -1px;
    color: #1e3a8a;
    margin-bottom: 6px;
  }
  .divider {
    width: 50px;
    height: 3px;
    background: #52525b;
    margin: 16px auto 20px;
    border-radius: 2px;
  }
  p.name {
    font-size: 1.15rem;
    font-weight: 600;
    color: #27272a;
    margin-bottom: 4px;
  }
  p.role {
    opacity: 0.6;
    font-size: 0.9rem;
    color: #52525b;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Hello, World! 👋</h1>
    <div class="divider"></div>
    <p class="name">Puttatida Petyotha</p>
    <p class="role">ผู้จัดทำเว็บไซต์นี้</p>
  </div>
</body>
</html>
